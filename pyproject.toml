[project]
name = "desktop-robot"
version = "0.1.0"
description = "通过语音与桌面机器人玩猜动物游戏"
readme = "README.md"
authors = [
    { name = "left0ver", email = "1614674987@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=2,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1.1,<2",
    "typesafe-sdk>=0.7.2",
    "watcherobot>=0.1.10",
    "websockets>=15,<16",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
