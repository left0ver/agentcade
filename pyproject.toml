[project]
name = "agentcade"
version = "0.1.0"
description = "与机器人聊天，玩你画我猜和海龟汤，通过 A2A 接入更多游戏。"
readme = "README.md"
authors = [
    { name = "left0ver", email = "1614674987@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=1.2.2,<2",
    "sse-starlette>=3.5,<4",
    "httpx>=0.28,<1",
    "uvicorn>=0.35,<1",
    "av>=14,<17",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "shapely>=2.1,<3",
    "svgelements>=1.9.6,<2",
    "python-dotenv>=1.1,<2",
    "pyyaml>=6,<7",
    "typesafe-sdk>=0.7.2",
    "watcherobot>=0.1.10",
    "websockets>=15,<16",
]

[project.scripts]
# uv run publish：登录发布平台并发布应用源码，见 src/agentcade/publish.py。
publish = "agentcade.publish:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.ruff]
target-version = "py311"
line-length = 100
