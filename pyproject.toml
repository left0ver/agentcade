[project]
name = "desktop-robot"
version = "0.1.0"
description = "通过语音与桌面机器人玩猜动物游戏"
readme = "README.md"
authors = [
    { name = "left0ver", email = "1614674987@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=1.2.2,<2",
    "sse-starlette>=3.5,<4",
    "httpx>=0.28,<1",
    "uvicorn>=0.35,<1",
    "av>=14,<17",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "shapely>=2.1,<3",
    "svgelements>=1.9.6,<2",
    "python-dotenv>=1.1,<2",
    "typesafe-sdk>=0.7.2",
    "watcherobot>=0.1.10",
    "websockets>=15,<16",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "sounddevice>=0.5.3,<0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -m 'not e2e'"
markers = [
    "e2e: 调用真实模型或机器人，显式使用 -m e2e 执行",
    "robot: 使用机器人、电脑扬声器和真实语音服务",
]

[tool.ruff]
target-version = "py311"
line-length = 100
