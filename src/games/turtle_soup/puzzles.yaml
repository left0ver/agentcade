# 海龟汤内置题库，都是不涉及死亡和恐怖的清汤，适合家里一起玩。
# 题目由 generator.py 生成并经过 Jev 审核，再人工挑选润色。
#   id       题目编号，不能重复
#   title    题目名称
#   surface  汤面：开局时念给玩家听
#   truth    汤底：玩家猜中、放弃或结束时公布
#   key      关键点：玩家的推理说中这些才算猜中
#   hints    三条提示，从模糊到具体
#   story    完整故事：判题时以它为准，不会念给玩家听
puzzles:

  - id: backward_running_dad
    title: 倒着跑的爸爸
    surface: 小区操场上，小豆在前面跑，爸爸却在她前方两三步，背对前方倒着往后退；练了半个月，总爱回头的她竟不再回头了。
    truth: 小豆跑步总回头看，是怕爸爸没跟在后面，一回头步子就乱，练了三个傍晚还是跑不快。爸爸问清原因后，从第四个傍晚起跑到她前方两三步，背对前方倒着往后退。这样小豆一抬头就看见爸爸的笑脸，听见他数拍子，就不用再回头找。爸爸倒着跑看不见身后，只能跑得很慢，还隔几秒扭头瞄一眼路。练了半个月，小豆能一口气跑完二百米，运动会冲线后只笑着回了一次头。
    key: 爸爸倒着跑，是为了让女儿一抬头就看见他的脸，不用再回头确认爸爸在不在。
    hints:
      - 她跑步时总回头，真正想确认的不是速度。
      - 爸爸没有改掉女儿的习惯，而是换了自己的位置。
      - 女儿一抬头，正前方总有一个让她安心的东西。
    story: |-
      小豆六岁，上幼儿园大班。九月初，幼儿园要办亲子运动会，小豆自己挑了“亲子200米”，要和爸爸一起跑。

      可小豆有个习惯：跑起来总爱回头看。她怕爸爸没跟在后面，跑两步就要扭过头找一找。一扭头，步子就乱了，跑得歪歪扭扭，怎么也跑不快。爸爸陪她练了三个傍晚，每次都这样。小豆急得直跺脚，说不想参加了。

      爸爸蹲下来问她：“你回头，是想干什么呀？”小豆说：“我想看看你在不在。”

      爸爸想了想，想出一个办法。

      从第四个傍晚开始，小区操场上就出现了奇怪的一幕：小豆在前面跑，爸爸却跑到她前面两三步的地方，背对着前方，一步一步倒着往后退。

      原来，爸爸把小豆回头要找的那张脸，挪到了她正前方。这样小豆一抬头就能看见爸爸在笑，听见爸爸数“一、二、一、二”，她就不用回头了。

      爸爸倒着跑，看不见身后的路，所以跑得格外慢，比小豆还慢。每隔几秒，他就飞快地把头扭到肩膀后面，瞄一眼脚下有没有石子、有没有人经过，再转回来看着小豆。妈妈第一次看见时吓了一跳，让他别这么跑。爸爸说不要紧：他只在最外圈跑，那儿傍晚人最少，他又跑得慢，小豆跑多快他就退多快，两人之间始终隔着两步远。

      练了半个月，小豆真的能一口气跑完200米，一次也不回头了。运动会那天，爸爸站在终点，小豆冲过线，还是回了一次头——不过这回，她是笑着回的。

      后来楼下的王阿姨才知道，那个天天在操场上倒着跑的男人，不是锻炼身体，也不是练什么怪功夫。他只是把自己的脸，放在女儿跑步时一抬头就能看见的地方。

  - id: kitchen_window_bell
    title: 开火前摇铃
    surface: 妈妈每次炒菜前都先开窗摇三下铃铛，再数十几下才开火；她做的菜越来越清淡。一天对面铃铛响了，她却拿出辣椒。
    truth: 两家人约定，妈妈摇三下铃表示要开火爆炒，李阿姨先关窗并把宝宝抱进里屋，等十几下是给她时间。李阿姨手机静音，所以用铃。妈妈第一次做辣子鸡，油烟和响声让宝宝咳到夜里两点，她红着脸回家后改做清淡少油的菜。对面挂黄毛巾表示宝宝去外婆家，不用摇铃；后来对面摇铃表示宝宝睡得沉，妈妈才拿出辣椒。
    key: 摇铃是和邻居约定，让李阿姨先关窗抱走宝宝；对面回铃表示可以放开炒。
    hints:
      - 铃声是摇给对面邻居听的。
      - 妈妈改清淡，是怕油烟和响声惊扰宝宝。
      - 对面挂黄毛巾或回铃，都表示当天情况不同。
    story: |-
      小明的家在老小区的三楼，厨房窗户和隔壁楼的窗户只隔两米多。对面住着李阿姨和她六个月大的宝宝。

      不知从哪天起，妈妈在厨房窗边挂了一串小铃铛。每次要炒菜，她都先推开窗，捏着铃铛摇三下，“叮铃铃”，然后站着数上十几下，看看对面窗户，才开火。

      小明觉得好笑：“妈妈，你是在叫灶王爷起床吗？”妈妈笑笑，不解释。

      更怪的是，妈妈炒菜越来越“素”了。以前她最爱做辣子鸡、爆炒腰花，油多火大味道冲。现在油只放一点点，辣椒收进柜子最里面，连爆锅的葱姜都切得薄薄的，下锅时几乎听不见响。小明抱怨菜没味儿，妈妈说：“忍一忍，等你李阿姨的宝宝大一点，我给你做十盘辣子鸡。”

      有一回小明嘴馋，趁妈妈在阳台收衣服，偷偷打火想炒个蛋炒饭。刚把油倒进锅，妈妈冲进来一把关了火：“先摇铃！”

      原来，妈妈第一次炒辣子鸡那天，油烟和响声直冲对面窗户。晚上在楼下碰到李阿姨，李阿姨只说了一句：“宝宝今天咳了好久，到夜里两点才睡着。”就这一句，妈妈红着脸回了家，第二天就在窗边挂了铃铛。

      两家人说好：铃响三下，就是“我要开火了”，李阿姨赶紧关窗、把宝宝抱到里屋；铃不响，就表示今天只煮面、蒸饭，没油烟。李阿姨手机常年静音，怕吵醒宝宝，打电话不灵，所以用铃铛。妈妈摇完还要等一会儿，是给李阿姨留关窗的时间。还有一条：要是对面窗户上挂出一条黄毛巾，就说明宝宝被送去外婆家了，那天不用摇铃。所以那天中午，对面晾着黄毛巾，妈妈只在锅里下了面。

      小明老老实实摇了三下铃，捏着嗓子数了十五下。对面“咔哒”一声关了窗，他这才把油倒进锅里。

      后来有一天，铃铛“叮铃铃”响了。这次不是妈妈摇的，是对面。李阿姨和她约好：对面摇铃，就是“今天宝宝睡得沉，你可以放开炒了”。妈妈愣了一下，笑着把辣椒从柜子最里面拿了出来。

  - id: night_shift_breakfast
    title: 夜里的早饭
    surface: 小明家每天傍晚六点半飘出煎鸡蛋和热牛奶的香味，七点爸爸穿反光背心、工装裤，拎着工具包出门，家人却互道早上好，小明七点半就睡觉。
    truth: 傍晚六点半的煎蛋和热牛奶，其实是妈妈把晚饭做成早饭的样子。爸爸是地铁检修员，晚上七点半上班，第二天早上五点半才下班。小明早上七点要上学，那时爸爸还在回家路上。为让小明每天和爸爸吃一顿热饭，七点爸爸穿反光背心、工装裤，拎工具包出门，全家互道早上好，小明按上学作息七点半睡觉，周末才恢复正常三餐。
    key: 爸爸上夜班，全家把晚饭做成早饭，只为在他出门前一起吃顿热饭。
    hints:
      - 先别按正常早晚来看这家的作息。
      - 爸爸的上班时间和出门打扮是关键。
      - 那顿热饭是在爸爸上班前特意安排的。
    story: |-
      小明家搬进新小区后，邻居很快发现一件怪事。每天傍晚六点半，小明家就飘出煎鸡蛋和热牛奶的香味。七点整，爸爸穿上反光背心和工装裤，拎起沉甸甸的工具包，妈妈和小明站在门口，认真地说：“早上好，路上小心。”爸爸走后，小明刷牙、换睡衣，七点半就上床睡觉。邻居想：这家人怎么把傍晚当早晨？
      后来大家才知道，爸爸是地铁检修员，晚上七点半上班，第二天早上五点半才下班。小明早上七点要上学，那时爸爸还在回家路上。为了让小明每天都能和爸爸一起吃一顿热饭，妈妈把晚饭做成早饭的样子。爸爸出门前，他们一起煎蛋、热牛奶，互道“早上好”，就像别人家的清晨。小明还把爸爸的饭盒洗干净，放在工具包旁边。周末爸爸休息，他们才按正常时间吃三餐。邻居知道后说，这顿“夜里的早饭”比闹钟还准时。

  - id: noon_dinosaur_dentist
    title: 午休的恐龙
    surface: 每周三中午，爸爸说去医院食堂吃饭，小明却撞见他穿着绿色恐龙玩偶服走进幼儿园。
    truth: 爸爸是儿童医院牙科医生，很多小朋友一见白大褂就闭嘴。妈妈在阳光幼儿园当老师，便请爸爸每周三午休来帮忙。爸爸对家里说去医院食堂吃饭，实际穿上绿色恐龙服，以恐龙医生的身份带孩子做刷牙操、逗怕生的小朋友。他不是当玩偶演员，而是先让孩子和恐龙医生玩熟，再慢慢不怕检查牙齿。
    key: 爸爸穿恐龙服不是当玩偶演员，而是以恐龙医生身份帮怕看牙的孩子放松。
    hints:
      - 别只看中午去了哪里，想想爸爸为什么需要换一身装扮。
      - 妈妈在幼儿园工作，爸爸的午休时间刚好能去帮忙。
      - 这身装扮是为了让孩子先放下戒心，再接受他本来的身份。
    story: |-
      小明妈妈在阳光幼儿园当老师。每周三中午，爸爸都对家里说去医院食堂吃饭，然后开车出门。小明一直没在意，直到有一个周三下午学校临时放假，他跑去幼儿园找妈妈，正好看见爸爸把车停在幼儿园后门。爸爸从后备箱里拿出一件鼓鼓的绿色恐龙玩偶服，套在身上，又把一个大袋子塞进恐龙肚子上的口袋，然后摇摇晃晃走进了幼儿园。小明吓了一跳：爸爸不是牙医吗？怎么偷偷来当玩偶演员？

      他没敢叫爸爸，悄悄跟在后面。操场上，一群小朋友正排队等着。恐龙一出现，孩子们就笑着喊“恐龙医生来啦”。恐龙蹲下来，从口袋里掏出牙刷模型、小镜子和卡通贴纸，带着大家做“左刷刷、右刷刷”的刷牙操。有个小男孩害怕地往后躲，恐龙就趴在地上学恐龙叫，逗得小男孩伸手摸它的尾巴。小明还看见，恐龙的大脚掌里露出爸爸那双旧运动鞋。

      下午，爸爸换回衬衫，照常回医院上班。晚上吃饭时，小明忍不住问：“爸爸，你中午是不是去幼儿园兼职扮恐龙？”爸爸一愣，笑着从柜子里拿出恐龙玩偶头套。妈妈也笑了，说：“是我请他来帮忙的。”原来，爸爸是儿童医院牙科医生，很多小朋友一看到白大褂就闭紧嘴巴。幼儿园想请人教孩子刷牙，妈妈就建议让爸爸穿上恐龙服，先用“恐龙医生”的身份和孩子们玩熟，再慢慢告诉他们，恐龙医生也会检查牙齿。这样孩子就不怕了。爸爸每周三午休有两小时，正好够去幼儿园做一次活动。那些贴纸和牙刷模型，都是他自掏腰包买的。

      小明想起自己小时候也怕看牙，是爸爸先给他讲恐龙故事，他才肯张嘴的。他摸摸恐龙的大尾巴，说：“原来你中午不是去吃饭，是去当恐龙医生呀。”

  - id: three_ten_window_cat
    title: 三点十分的窗外
    surface: 每天下午三点十分，老师和学生会一起突然安静，齐刷刷看向同一扇窗，约一分钟后才恢复。
    truth: 开学第一周，李老师连上两节课眼睛累，走到窗边休息，正看见对面天台有只橘猫，第二天同一时间它又出现。老师便把三点十分定为休息眼睛一分钟，让全班看远处，大家发现猫比闹钟还准时，就当它是报时猫。为了不吓跑猫，那个时间谁都不出声；下雨天猫不出来，大家就闭眼歇一分钟。全班和老师一起看的是那只准时散步的橘猫。
    key: 全班三点十分看窗外，是在看准时到对面天台散步的橘猫，也是老师定的休息眼睛时间。
    hints:
      - 往大家共同关注的东西和固定时间上想。
      - 他们看的不是教室里的事，而是窗外远处。
      - 那只动物每天差不多同一时间来，下雨就不出现。
    story: |-
      四（3）班有个谁也说不上来的“怪毛病”。

      新转来的小宇发现：每天下午第三节课上到一半，差不多三点十分，教室里会忽然安静下来。先是靠窗的同学用胳膊肘碰一碰同桌，接着一个传一个，全班四十个人都放下笔，齐刷刷地扭头看向同一扇窗户。连班主任李老师也会停下讲课，扶一扶眼镜，跟着一起看。大约一分钟后，大家又像什么都没发生一样，低头继续写作业。

      小宇憋了整整一个星期。这天下午，他终于忍不住，小声问同桌：“你们到底在看什么呀？”

      同桌竖起一根手指“嘘”了一声，朝窗外努努嘴。

      小宇顺着看过去：对面那栋楼的天台上，一只胖橘猫正慢悠悠地沿着矮墙散步，走到中间还停下来，抬起一只前爪舔了舔。等它走到天台另一头，纵身跳下去不见了，教室里才“呼”地一下松弛下来，有人小声说：“走啦走啦。”

      同桌告诉他：开学第一周，李老师连着上了两节课，眼睛累得直眨。她走到窗边歇一歇，正好看见那只猫。第二天同一时间，猫又出现了。李老师干脆把三点十分定成班里的“休息眼睛一分钟”，让全班一起看看远处。后来大家发现，那只猫比闹钟还准时，就把它当成了下课前的“报时猫”。为了不把它吓跑，那个时间谁都不许出声。下雨天猫不出来，大家就安静地闭上眼睛歇一分钟，再接着上课。

      “那这是咱们班的秘密？”小宇问。

      “也不算秘密啦，”同桌笑着说，“昨天校长还趴在窗户外头，跟我们一块儿看呢。”

  - id: daily_letter_home
    title: 每天一封信
    surface: 每天早晨，上夜班的妈妈把一封收件人是朵朵、地址是自家的信投进小区门口邮筒，第二天朵朵却从自家信箱收到。
    truth: 妈妈在面包房上夜班，晚上七点出门，早上七点回家；朵朵下午放学时妈妈在补觉，两人常碰不上面。妈妈上班不能看手机，便在凌晨三点面包出炉的间隙写信，把叮嘱封好贴上邮票。她怕纸条被风吹丢，趁早下班把信投进小区门口邮筒，让邮递员八点收走，第二天上午送到自家信箱。朵朵放学取信，找王奶奶念，王奶奶在信封角画星；最后朵朵也写信投给面包房的妈妈。
    key: 妈妈和女儿作息错开见不着，便每天把写给女儿的信寄回自家，让邮局第二天送到。
    hints:
      - 先想想母女俩一天里为什么总说不上几句话。
      - 再留意妈妈投信和邮递员开箱分别在什么时间。
      - 寄信人和收信人住在一起，为什么还要让信走一趟邮局？
    story: |-
      朵朵家住在阳光小区三楼。每天早晨七点，上完夜班的妈妈都会在小区门口的绿色邮筒前停一下，把一只信封投进去。信封上写着“朵朵收”，下面写的是自家的楼号和门牌。邮递员八点来开箱。

      妈妈在街角的面包房上班，晚上七点出门，早上七点回家。那时朵朵还在被窝里；等朵朵下午放学，妈妈又开始补觉了。一天里，母女俩常常只说上一句“路上小心”和“晚安”。面包房上班时不让看手机，妈妈想说的话，攒着攒着就攒成一封封信。

      所以妈妈在凌晨三点、面包出炉的间隙写信。她把一天要说的话写在信纸上：“冰箱第二层有玉米”“记得把阳台的花搬进来”“数学练习册最后一页别忘了”。写完，她把信封好，贴上邮票。她从来不把信留在桌上，因为有一次她把纸条压在桌角，朵朵起床后找袜子，纸条被风卷到沙发底下，谁也没看见。

      八点，邮递员开箱，把信收走；第二天上午，这封信被塞进朵朵家的信箱。朵朵放学回来，打开信箱，一眼就认出自己的名字。她不急着拆，抱着信跑到对面楼找王奶奶。王奶奶一个人住，戴上老花镜，把信一个字一个字念出来，遇到生字就用铅笔圈一下。朵朵跟着念，念完了，王奶奶就在信封角上画一颗小星星。

      妈妈说过，等她把这些星星攒够一百颗，就教她自己写信。

      其实妈妈还有个小心思：每封信上都盖着邮局的日期戳。朵朵把信按日期叠好，一年下来，就是厚厚的一本。妈妈说过，那是她们一起攒下的日子。

      那天，朵朵第一次自己写了一封信，只有四个字：“妈妈，晚安。”她把信投进邮筒，收件人写的是“面包房 妈妈收”。

  - id: kitchen_warm_stones
    title: 锅里的石头
    surface: 冬天每天傍晚，妈妈把鹅卵石倒进炒锅翻炒，炒热后装进旧毛巾布袋，送到楼下花坛边。
    truth: 妈妈把鹅卵石炒热装进旧毛巾布袋，让小明送到花坛边，是给纸箱里三只流浪小猫做暖垫。小猫会咬东西，热水袋破了危险，石头温度稳，裹着毛巾不会烫，凉了还能再炒热。晚饭前炒是因为正好做饭不浪费火，傍晚最冷，小猫最需要暖垫。邻居曾觉得奇怪，后来见小猫暖和便明白了，春天小猫被领养，妈妈洗净收好石头，准备下个冬天再用。
    key: 妈妈炒热鹅卵石装袋，是给流浪小猫做安全保暖的暖垫。
    hints:
      - 反常的炒石头可能和照顾花坛边的小生命有关。
      - 热石头装进布袋，被送到楼下纸箱旁。
      - 热水袋容易被咬破，石头不会。
    story: |-
      冬天一到，小明家厨房每天傍晚都会发生一件怪事。妈妈先把一盆圆溜溜的鹅卵石洗得干干净净，再倒进炒锅里，开小火慢慢翻动。石头碰到锅底，发出“沙沙”的轻响。爸爸闻声走进来，笑着说：“又在给锅做按摩？”妈妈只是笑笑，继续数着数。小明也觉得奇怪：这些石头既不能吃，也不是玩具，妈妈为什么每天都要炒一遍？

      等石头被炒得微微发烫，妈妈就关火，用长柄勺把它们舀进一个旧毛巾缝的布袋里，扎紧袋口，让小明拎到楼下花坛边。花坛角落有一个纸箱，里面住着三只流浪小猫。北风一吹，小猫就缩成一团，喵喵叫。小明把热乎乎的石头袋放进纸箱，小猫们立刻围过来，贴着袋子趴下，舒服得眯起眼睛。

      小明这才明白，妈妈炒石头不是做饭，而是在给小猫做暖垫。他问：“为什么不用热水袋呢？”妈妈说：“小猫会咬东西，热水袋破了危险。鹅卵石加热后温度稳，外面裹着毛巾，不会烫着它们，凉了还能再炒热。”小明又问：“为什么总在晚饭前炒？”妈妈指指灶台：“这时候正好要做饭，火不浪费；而且傍晚最冷，小猫最需要暖垫。”

      有时邻居看见妈妈端着锅倒石头，觉得十分奇怪。后来他们发现，纸箱里的小猫总是暖暖和和的，就明白了。春天来了，三只小猫都被好心人领回家。妈妈把鹅卵石洗干净，收进柜子里，说：“下个冬天，说不定还有用。”

  - id: cafeteria_broadcast
    title: 食堂广播
    surface: 每天中午，食堂广播都请李老师认领一份多出来的饭。他端走后从不自己吃，只坐在图书角看小明把饭吃完。
    truth: 小明父母开早餐店，中午收摊后还要进货，常只给他准备一个面包，他便不去食堂，独自在图书角啃面包。李老师想请他吃饭又怕他不好意思，就找王阿姨每天多蒸一盒饭，广播里说成多出来的，由李老师认领。李老师端到图书角，借口菜咸了让小明帮尝，实际让小明安心吃完。后来王阿姨告诉同学，那不是多出来的，是李老师提前订给图书角那个孩子的。
    key: 李老师认领所谓多出来的饭，是为保护自尊悄悄送给中午没饭吃的小明。
    hints:
      - 先想李老师为什么总把饭端去图书角。
      - 小明中午不去食堂，常在图书角啃面包。
      - 多出来的饭不是算错，是有人特意安排的。
    story: |-
      每天中午十二点，学校食堂的广播都会响：“请李老师到窗口认领一份多出来的饭。”李老师是五年级的语文老师，他每次都在同学们的目光里端走那份饭，却从不坐在食堂吃，而是穿过走廊，走到图书角，坐在小明对面，说：“今天菜好像咸了，你帮老师尝一口。”小明就拿起勺子，把饭一口口吃完。李老师坐在旁边看，等小明吃完，把空饭盒收走。
      同学们觉得奇怪：多出来的饭为什么天天都有？李老师为什么自己不吃？有人猜食堂算错了，有人猜李老师贪小便宜。小明也以为李老师真的吃不完，才请他帮忙。
      其实，一个月前，李老师发现小明中午总不去食堂，一个人坐在图书角啃干面包。原来小明的爸爸妈妈开早餐店，中午收摊后还要去进货，常常只能给他准备一个面包。李老师想请小明吃饭，又怕小明不好意思，就找食堂王阿姨商量：每天多蒸一盒饭，广播里说是“多出来的”，由李老师认领。李老师端到图书角，借口“菜咸了，帮我尝尝”，让小明安心吃。王阿姨一直配合，从不多问。
      后来，一个同学去食堂问王阿姨：“为什么每天都有多出来的饭？”王阿姨笑着说：“那不是多出来的，是李老师提前订给图书角那个孩子的。”同学们这才明白，李老师每天端走的不是便宜，而是一份悄悄藏起来的关心。小明知道后，还是每天中午去图书角，因为他和李老师约好了：等他学会帮家里包一百个包子，就换成他请李老师吃一顿真正的饭。

  - id: mid_autumn_mirror
    title: 中秋的镜子
    surface: 中秋夜，小明家关掉阳台和客厅的灯；爸爸在阳台用卷尺调一面大镜子，还用手电照，让小明端月饼去对面李奶奶家。
    truth: 李奶奶年纪大、下楼费劲，去年中秋说好久没好好看月亮。爸爸是物理老师，去年试过后，今年用卷尺和手电调好镜子角度，把月光反射到李奶奶家墙上。妈妈让她别拉窗帘，家里关灯是为让映出的小月亮更清楚。小明送月饼时看到墙上的亮光，才明白这是让李奶奶不用下楼也能赏月。
    key: 关灯调镜是为把月光反射到对面楼李奶奶家墙上，让下楼不便的她不用出门也能赏月。
    hints:
      - 先想想关灯和照镜子是不是为了别人。
      - 重点看对面楼那位年纪大、下楼费劲的老人。
      - 镜子和月光被调成一小块亮光送进老人屋里。
    story: |-
      中秋节晚上，小明家准备在阳台赏月。可妈妈把阳台灯关了，客厅灯也关了，只留厨房一盏小灯。爸爸搬出一面大穿衣镜，用卷尺量来量去，还拿手电筒照镜子，嘴里念着：“再往左一点。”小明觉得奇怪：别人家都亮堂堂的，为什么自己家黑着灯照镜子？

      更奇怪的是，妈妈还打电话给对面楼三楼的李奶奶：“您今晚别拉窗帘，月亮很亮。”小明知道李奶奶年纪大了，下楼一趟很费劲，儿女又在外地。去年中秋，小明和妈妈给她送过月饼，李奶奶看着窗外说：“我好久没好好看过月亮了。”

      爸爸把镜子架在阳台栏杆边，调了好一会儿，终于点头：“好了。”他让小明端上一盒月饼，去李奶奶家看看。小明敲开门，李奶奶正坐在客厅里，窗帘开着。小明顺着她的目光看过去，对面自己家的阳台上，镜子把月亮的光反照过来，在李奶奶家墙上映出一小块圆圆的亮光，像一个小月亮。

      李奶奶笑着说：“看到了，看到了，今年的月亮真圆。”小明这才明白，爸爸是物理老师，知道怎么用镜子反射月光；妈妈不拉窗帘，是为了让光照进来；家里关灯，是为了让反射的小月亮更清楚。去年他们试了一次，今年提前量好角度，就是想让李奶奶不用下楼也能赏月。

      邻居看见小明家黑着灯挂镜子，本来觉得奇怪，后来听说原因，都笑着夸他们想得妙。小明回家时，爸爸正把镜子擦干净。阳台上，真正的月亮挂在天上，而对面楼那扇窗里，也亮着一小块温柔的月光。

  - id: suitcase_airport_drill
    title: 周五的箱子
    surface: 每周五晚饭后，一家四口都拖着看起来不重的大箱子绕小区走一圈，约二十分钟后回家，不像去旅行。
    truth: 小明下个月要第一次坐飞机去外婆家，他担心飞机会迷路，也怕自己不会办登机。爸爸便把每周五晚饭后的散步变成机场演练，用小区门口当候机楼、花坛当登机口。全家拖着只装手绘地图、纸登机牌和小水壶的箱子，按流程走一圈，约二十分钟后回家，妈妈发登机牌，姐姐当空乘说欢迎登机。练了几次，小明记住了流程也不再紧张，王阿姨听完也领了一张纸登机牌加入。
    key: 全家拖空箱子绕小区，是在陪小明演练第一次坐飞机，并非去旅行。
    hints:
      - 先想想他们为什么固定每周五做同一件事。
      - 这跟一次还没到来的远行和紧张心理有关。
      - 小区门口和花坛被当成了出行流程里的地点来练习。
    story: 每周五晚饭后，小明一家四口都会拖着一个大行李箱出门，绕着小区走一圈，还轮流拉箱子、看手表，二十分钟后又回家。邻居王阿姨从窗户看见，觉得奇怪：箱子看起来不重，他们也不像去旅游。有一天，王阿姨在楼下碰见他们，问：“你们每周都拖着箱子散步，是不是要去赶火车？”小明笑着打开箱子，里面只有一张手绘地图、四张纸做的登机牌和一个小水壶。原来，小明下个月要第一次坐飞机去外婆家，他担心飞机会不会迷路，也怕自己不会办登机。爸爸就把周五散步变成“机场演练”：小区门口是“候机楼”，花坛是“登机口”，全家拉着空箱子走一遍，妈妈发登机牌，姐姐当空乘说“欢迎登机”。走了几次，小明记住了流程，也不紧张了。王阿姨听完，也领了一张纸登机牌，笑着说：“那我也当一次乘客，跟你们走一圈。”

  - id: neighborhood_board_game
    title: 会走路的棋盘
    surface: 每周六下午，阳光小区一家三口拿着手绘地图和纸板骰子，在邮筒旁单脚跳、学猫叫、贴星星，再数到七跑向凉亭。邻居看他们没棋盘也没对手，却认真得像在比赛。
    truth: 一个月前小区准备邻里节，小明提议做小区大富翁，爸妈一起画地图、写任务卡、做骰子和星星贴纸。规则是沿人行道走到邮筒、花坛、凉亭等格子，抽任务卡做动作，完成后贴星星再掷骰子前进。为了不挡路，他们把游戏定在周六下午，单脚跳、猫叫和数数都是抽到的任务，跑向凉亭是去下一格。后来邻里节大家照地图玩了一次，才明白这支队伍在比赛什么。
    key: 他们每周按手绘地图玩自制小区大富翁，单脚跳猫叫等都是任务卡任务。
    hints:
      - 别往仪式或暗号想，注意地图和骰子。
      - 那些动作不是固定流程，而是抽到后照做的内容。
      - 他们把小区地点当格子，完成一格才贴一颗星。
    story: 每周六下午三点，阳光小区里总会出现一支奇怪的队伍：爸爸拿着一张手绘地图，妈妈举着一块纸板骰子，小明背着布袋。他们走到三号楼前的邮筒旁，爸爸先单脚跳三下，妈妈学两声猫叫，小明在邮筒背面贴一颗星星贴纸，然后全家一起数一到七，再朝凉亭跑。到了凉亭，他们又抽一张小纸条，照着上面的字做动作。邻居看了好几周，觉得他们没有棋盘、没有对手，却认真得像在比赛，怎么也想不通。其实一个月前，小区准备办邻里节，小明提议做一款小区大富翁。他把邮筒、花坛、凉亭画成格子，妈妈写任务卡，爸爸做骰子和星星贴纸。规则是：只能沿人行道前进，不能踩草坪；每到一处地点就抽任务卡，完成任务后贴星星，再掷骰子去下一格。为了不挡路，他们把游戏定在周六下午，还让小明背水壶和贴纸。邻居看到的单脚跳、猫叫和数数，正是他们抽到的任务。后来邻里节上，大家照这张地图玩了一次，终于明白这支队伍在做什么。

  - id: empty_school_bus
    title: 空校车
    surface: 暑假每天下午，王阿姨开着空校车经过梧桐路，每到一个站牌就停车开门等一会儿，还在小本子上写字。车上没有孩子，她却像认真接人一样。
    truth: 王阿姨是校车司机。新学年学校要公布新路线，这条路上新添了两个小区、一个菜市场和一段修路。她趁暑假空车试跑，每到站牌就停车开门，模拟孩子上下车并计时。小本子记的是站牌、台阶、树荫和等待秒数，不是乘客名单。空车是在替还没开学的孩子们先走一遍路，检查上下学站点是否安全。
    key: 王阿姨开空校车反复停靠，是为新学期新路线做安全试跑，不是接乘客。
    hints:
      - 先想想空车为什么还要按站停靠。
      - 这和王阿姨新学期要跑的新路线有关。
      - 停车开门是在模拟孩子上下车，并记录站点情况。
    story: 小明家住在梧桐路。暑假里，他每天下午都看见隔壁的王阿姨开着一辆空校车经过。王阿姨是校车司机。奇怪的是，她每到一个站牌就停下，打开车门，等一会儿，再在小本子上写字。车上一个孩子也没有，她却像接人一样认真。小伙伴们笑着说，那是一辆“看不见乘客”的校车。小明很好奇，一天下午，他拿着一瓶水去问王阿姨。王阿姨请他上车看：每个座位上放着不同颜色的坐垫，过道边贴着小脚印，车门旁还挂着一个小计时器。她告诉小明，新学年学校要公布新路线，这条路上新添了两个小区、一个菜市场，还修了一段路。她要趁暑假把新路线空车试跑一遍：哪个站牌前有台阶、哪段路下午太阳太晒、哪个路口车多需要多等几秒，都要记下来。她停车开门，是模拟孩子们上下车，计时看从站牌走到车门要多久。小本子上记的不是乘客名单，而是“站牌、台阶、树荫、等待秒数”。小明这才明白，空车不是没人可接，而是在替还没开学的孩子们先走一遍路。开学那天，王阿姨的校车停在小明家门口，孩子们笑着上车，她还特意指了指新贴的小脚印。
