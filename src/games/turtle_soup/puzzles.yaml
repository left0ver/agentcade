# 海龟汤题库。都是不涉及死亡和恐怖的“清汤”，适合家里一起玩。
#   id       题目编号，不能重复
#   title    题目名称
#   surface  汤面：开局时念给玩家听的故事
#   truth    汤底：只有判题能看到，玩家猜中、放弃或结束时才公布；判断提问按它来
#   key      关键点：玩家的推理说中这些才算猜中
#   hints    三条提示，从模糊到具体
puzzles:
  - id: elevator
    title: 只坐到二十楼
    surface: 一个人住在三十楼。每天早上他坐电梯下到一楼出门；晚上回家，他总是坐电梯到二十楼，再走楼梯上去。只有下雨天，他能直接坐到三十楼。
    truth: 他是个个子很矮的小朋友，够不着电梯里三十楼的按钮，最高只能按到二十楼。下雨天他带着雨伞，可以用伞去按三十楼的按钮。
    key: 他个子矮，够不着三十楼的按钮；下雨天用伞去按。
    hints:
      - 他走楼梯并不是为了锻炼身体。
      - 这和电梯里的按钮有关。
      - 下雨天他手里多了一样长长的东西。

  - id: monopoly
    title: 酒店门口的破产
    surface: 一个男人推着自己的车来到一家酒店门口。一看到这家酒店，他就知道自己破产了。
    truth: 他正在和朋友玩大富翁桌游。他的棋子是一辆小汽车，走到了别人盖了酒店的地上，付不起过路费，所以在游戏里破产了。
    key: 他在玩大富翁之类的桌游，棋子走到别人的酒店，付不起钱而破产。
    hints:
      - 车和酒店都不是真的。
      - 这件事发生在一张桌子上。
      - 这是一个很多人一起玩、要掷骰子的游戏。

  - id: snoring
    title: 半夜的电话
    surface: 深夜，一个男人给邻居打了个电话。电话接通后，他一句话也没说就挂了，然后很快就安心地睡着了。
    truth: 邻居打呼噜的声音太大，吵得他睡不着。他打电话把邻居吵醒，邻居醒了就不打呼噜了，他也就睡着了。
    key: 邻居打呼噜太吵，他打电话把邻居吵醒。
    hints:
      - 他睡不着是因为邻居。
      - 他能听到邻居家传来的声音。
      - 他打电话就是想让邻居醒过来。

  - id: hiccups
    title: 一杯水和一声大喊
    surface: 一个人走进一家店，向店员要一杯水。店员没有给他水，反而突然冲他大喊一声。那人愣了一下，笑着说了声谢谢就走了。
    truth: 那人一直在打嗝，想喝水止住。店员看出来了，就突然大喊吓他一跳，他的嗝被吓停了，所以也不需要水了。
    key: 他在打嗝，店员吓了他一下，帮他止住了嗝。
    hints:
      - 他要水并不是因为口渴。
      - 他的身体出了一点小状况。
      - 被吓一跳正好能治好这个状况。

  - id: daytime
    title: 没有灯的马路
    surface: 一个司机开车没开车灯，路上没有路灯，天上也没有月亮。一个穿着全黑衣服的人横穿马路，司机却老远就看见了他，及时停了车。
    truth: 这件事发生在白天，阳光很好，不需要任何灯也能看得很清楚。
    key: 当时是白天。
    hints:
      - 司机的视力很普通。
      - 想想这件事发生在几点钟。
      - 那时候根本用不着灯。

  - id: surgeon
    title: 不能做的手术
    surface: 一个男孩受伤被送进医院。外科医生看到他就说：“我不能给他做手术，他是我儿子。”可这位医生并不是男孩的爸爸。
    truth: 这位外科医生是男孩的妈妈。
    key: 医生是男孩的妈妈。
    hints:
      - 医生说的是真话，男孩确实是医生的孩子。
      - 别默认医生是男的。
      - 男孩有两位家长。

  - id: ice
    title: 倒扣的水杯
    surface: 小明把一个装满水的杯子倒扣在桌上，拿开杯子之后，桌上一滴水都没有洒。
    truth: 杯子里的水已经冻成了冰，倒过来就是一整块冰，所以不会洒出来。
    key: 水已经结成了冰。
    hints:
      - 杯子里的确是水，没有被换成别的东西。
      - 这杯水之前放在很冷的地方。
      - 水还在，只是变了个样子。

  - id: bald
    title: 淋不湿的头发
    surface: 下大雨，一个人在外面走了半个小时，没打伞，没戴帽子，衣服全湿透了，可他的头发一根都没湿。
    truth: 他是光头，头上根本没有头发。
    key: 他是光头，没有头发。
    hints:
      - 雨确实淋到了他的头上。
      - 这和他的发型有关。
      - 他的头发少得不能再少了。

  - id: window
    title: 二十楼的一跃
    surface: 一个人在二十层楼的高处，从一扇打开的窗户一跃而过，却一点伤都没有。
    truth: 他是在大楼外面擦玻璃的工人，原本站在窗外，是从窗外跳进了屋里。
    key: 他本来在楼外擦窗户，是从窗外跳进屋里的。
    hints:
      - 他是故意跳的，而且很清楚自己在做什么。
      - 他本来就待在大楼的外面。
      - 想想他是往哪个方向跳的。

  - id: triplets
    title: 不是双胞胎
    surface: 小红和小兰同年同月同日出生，爸爸妈妈也是同一对，两人长得一模一样，可她们并不是双胞胎。
    truth: 她们是三胞胎里的两个，家里还有一个同一天出生的兄弟姐妹。
    key: 她们是三胞胎。
    hints:
      - 她们确实是同一次出生的。
      - 那天出生的不止她们两个。
      - 想想比双胞胎更多的情况。

  - id: birthday
    title: 拿刀进门
    surface: 一个人拿着一把刀走进一间挤满了人的屋子，所有人看到他都欢呼起来。
    truth: 今天是屋里某个人的生日，大家在开派对。他拿着刀是来切生日蛋糕的。
    key: 他拿刀是来切生日蛋糕的。
    hints:
      - 屋子里的人正在庆祝。
      - 桌上摆着好吃的东西。
      - 今天是某个人特别的日子。

  - id: braille
    title: 停电后的读书声
    surface: 晚上停电了，屋里一片漆黑，小李却一直在读书，读得津津有味。
    truth: 小李是盲人，他读的是盲文书，用手指摸着读，不需要光。
    key: 小李是盲人，在用手摸着读盲文书。
    hints:
      - 他读书不靠眼睛。
      - 这本书摸起来有一个个小凸点。
      - 他平时看书也从来不需要开灯。
